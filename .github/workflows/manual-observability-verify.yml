name: Manual observability verification
run-name: Observability / ${{ inputs.check }} / ${{ inputs.source_sha }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit to verify
        required: true
        type: string
      check:
        description: Module verification or a narrowly selected failed test suite
        required: true
        default: module-verify
        type: choice
        options:
          - module-verify
          - selected-tests
      test_filter:
        description: Maven Surefire selector, required for selected-tests
        required: false
        type: string

permissions:
  contents: read

jobs:
  observability:
    name: Observability / Ubuntu 24.04 / Java 17
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SELECTED_CHECK: ${{ inputs.check }}
      TEST_FILTER: ${{ inputs.test_filter }}
    steps:
      - name: Check out the exact source commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and selection
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full commit SHA'; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]] || { echo 'Wrong source commit'; exit 1; }
          case "$SELECTED_CHECK" in
            module-verify) ;;
            selected-tests)
              [[ -n "$TEST_FILTER" ]] || { echo 'A failed test selector is required'; exit 1; }
              ;;
            *) echo 'Unsupported check'; exit 1 ;;
          esac
          echo "Verified source commit: $SOURCE_SHA"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Run the selected observability check
        shell: bash
        run: |
          set -euo pipefail
          args=(-B -ntp -Dscan=false -Ddevelocity.scan=false -Dmaven.build.cache.enabled=false
            -pl spring-modulith-observability/spring-modulith-observability-core -am)
          case "$SELECTED_CHECK" in
            module-verify) args+=(verify) ;;
            selected-tests)
              args+=("-Dtest=$TEST_FILTER" -Dsurefire.failIfNoSpecifiedTests=false test)
              ;;
          esac
          ./mvnw "${args[@]}"

      - name: Record the tested source and JUnit results
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          reports = sorted(Path('.').glob('**/target/surefire-reports/TEST-*.xml'))
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          module_totals = {}
          failures = []
          for path in reports:
              root = ET.parse(path).getroot()
              counts = {key: int(root.get(key, '0')) for key in totals}
              module = path.parent.parent.parent.name
              aggregate = module_totals.setdefault(module, dict.fromkeys(totals, 0))
              for key, count in counts.items():
                  totals[key] += count
                  aggregate[key] += count
              for case in root.findall('testcase'):
                  if case.find('failure') is not None or case.find('error') is not None:
                      failures.append(f"{case.get('classname')}#{case.get('name')}")

          def result(counts):
              passed = counts['tests'] - counts['failures'] - counts['errors'] - counts['skipped']
              return (f"{passed} passed, {counts['skipped']} skipped, "
                      f"{counts['failures']} failed, {counts['errors']} errors")

          lines = [
              '## Manual observability verification', '',
              f"Source: `{os.environ['SOURCE_SHA']}`", '',
              'Platform: Ubuntu 24.04 / Java 17', '',
              f"Selection: `{os.environ['SELECTED_CHECK']}`", '',
          ]
          if reports:
              lines += [f'JUnit: {result(totals)}', '']
              lines += [f'- {module}: {result(counts)}' for module, counts in module_totals.items()]
          else:
              lines += ['No JUnit reports were produced; test execution is not confirmed.']
          if failures:
              lines += ['', 'Failed test selectors:'] + [f'- `{selector}`' for selector in failures]
          summary = '\n'.join(lines) + '\n'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write(summary)
          PY
